name: Backend quality gate

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "alembic.ini"
      - "alembic/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "alembic.ini"
      - "alembic/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:////tmp/dou-ci.db
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      ENABLE_LEGACY_DELIVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests tools seed.py
      - name: Verify versioned migrations and idempotency
        run: |
          python tools/migrate.py
          python tools/migrate.py
          alembic current
          alembic check
      - name: Run isolated regression tests
        run: python -m pytest -q
      - name: Check embedded dashboard JavaScript
        run: python tools/check_html_js.py
      - name: Block Python syntax-level lint failures
        run: ruff check app tests tools seed.py --select E9 --exclude venv

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag dou-server-ci .
