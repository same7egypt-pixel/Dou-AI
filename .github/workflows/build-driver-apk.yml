name: Build DOU Driver APK
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-driver/**', '.github/workflows/build-driver-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build installable APK
        working-directory: android-driver
        run: gradle assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../DOU-Driver.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DOU-Driver-APK
          path: DOU-Driver.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-latest
          name: DOU Driver — Latest Android APK
          prerelease: true
          files: DOU-Driver.apk
