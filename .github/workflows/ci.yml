name: CI

# Every guard the project relies on runs here. An earlier copy of this pipeline
# lived in deploy/ci/ci.yml, where GitHub never picked it up, so nothing was
# actually enforced on a push.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  SECRET_KEY: ci-test-secret-key-minimum-32-bytes-long
  ADMIN_KEY: ci-admin-key-16-bytes

jobs:
  backend:
    name: Lint, security scan and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff bandit

      - name: Lint
        run: ruff check app/ --select E,F,I,W --ignore E501

      - name: Security scan
        run: bandit -r app/ -ll -q

      - name: Tests
        run: pytest -q --tb=short

  migrations:
    name: Migrations apply cleanly and match the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dou_ci
          POSTGRES_USER: dou_ci
          POSTGRES_PASSWORD: dou_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dou_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Reproduces exactly what the container does on boot. Note this is not a
      # bare `alembic upgrade head`: revision 0001 adopts a pre-existing legacy
      # schema rather than creating it, so a from-empty upgrade is not a
      # supported path and only tools/migrate.py builds a correct database.
      - name: Build the database the way production does
        env:
          DATABASE_URL: postgresql://dou_ci:dou_ci_password@localhost:5432/dou_ci
        run: python tools/migrate.py

      - name: Fail if the models have drifted away from the schema
        env:
          DATABASE_URL: postgresql://dou_ci:dou_ci_password@localhost:5432/dou_ci
        run: alembic check

  frontend:
    name: Frontend modules parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check every ES module
        run: |
          status=0
          while IFS= read -r file; do
            node --check "$file" || { echo "::error file=$file::syntax error"; status=1; }
          done < <(find frontend-v2 -name '*.js' -not -path '*/node_modules/*')
          exit $status

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    needs: [backend, migrations, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dou-fleet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
