  function renderLogin(message=""){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$('app').innerHTML=`<section class="login-page"><button class="lang-btn login-language" onclick="toggleLang()">${t("language")}</button><div class="login-wrap"><div class="login-brand"><div class="brand-mark">D<i></i>ou</div><div class="brand-sub">RIDER</div><h1>${t("loginTitle")}</h1><p>${t("loginLead")}</p></div><div class="login-card"><div class="form-grid"><div class="field"><label for="loginPhone">${t("phone")}</label><input id="loginPhone" type="tel" inputmode="tel" autocomplete="username" dir="ltr" placeholder="9665…"></div><div class="field"><label for="loginPassword">${t("password")}</label><input id="loginPassword" type="password" autocomplete="current-password" dir="ltr" placeholder="••••••••"></div><button id="loginButton" class="btn primary full" onclick="doLogin()">${t("login")}</button></div>${message?`<p class="small" style="color:var(--danger);margin:13px 0 0">${esc(message)}</p>`:""}<div id="installLogin"></div></div></div><div id="toast" class="toast"></div></section>`;renderInstallHelper("installLogin")}
  function blockedView(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$('app').innerHTML=`<section class="blocked"><div class="blocked-card"><div class="blocked-icon">🔒</div><h1>${t("suspended")}</h1><p>${lang==="ar"?"لا يمكن متابعة الإجراءات أو عرض البيانات التشغيلية من هذا الحساب الآن.":"Operational actions and data cannot be accessed from this account at this time."}</p><button class="btn outline" onclick="clearSession()">${t("logout")}</button></div></section>`}
  async function doLogin(){const phone=$('loginPhone').value.trim(),password=$('loginPassword').value;const btn=$('loginButton');if(!phone||!password){showToast(t("genericError"),"error");return}btn.disabled=true;btn.textContent=t("loggingIn");try{const result=await api('/auth/login',{method:'POST',body:JSON.stringify({phone,password})});if(result.role!=="COURIER"){throw new Error(lang==="ar"?"هذا الحساب ليس حساب سائق.":"This is not a rider account.")}TOKEN=result.access_token;localStorage.setItem("dou_token_courier",TOKEN);localStorage.setItem("dou_role_courier",result.role);await loadCore();render()}catch(error){btn.disabled=false;btn.textContent=t("login");actionError(error)}}
  async function loadCore(){const [courier,shift,logs,hr,preferences]=await Promise.all([api('/couriers/me'),api('/shifts/me'),api('/hr/me/logs'),api('/hr/me/hr'),api('/couriers/me/preferences').catch(()=>null)]);state.core={courier,shift,logs,hr,preferences};if(preferences?.language&&["ar","en"].includes(preferences.language)&&!new URLSearchParams(location.search).get("lang")){lang=preferences.language;localStorage.setItem("dou_lang",lang)}}

  function render(){if(state.accessBlocked){blockedView();return}if(!TOKEN){renderLogin();return}if(!state.core){$('app').innerHTML=`<div class="app-shell"><main>${[1,2,3,4].map(()=>'<div class="skeleton"></div>').join('')}</main></div>`;return}document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";const c=state.core.courier;$('app').innerHTML=`<div class="app-shell"><header class="topbar">${appLogo()}<div class="top-actions"><button class="icon-btn" aria-label="${t("refresh")}" onclick="refreshCore()">↻</button><button class="lang-btn" onclick="toggleLang()">${t("language")}</button></div></header><div id="connection" class="connection ${navigator.onLine?'':'show'}">${navigator.onLine?'':`◌ ${t("offline")}`}</div><main>${renderHome()}${renderShifts()}${renderPerformance()}${renderEarnings()}${renderProfile()}</main>${renderNav()}<div id="toast" class="toast"></div></div>`;paintToast();if(state.view==='profile'){ensureExtras();ensureProjects()}if(state.view==='performance')ensureProjects();}
  function active(name){return state.view===name?'active':''}

  function renderHome(){const {courier:c,logs,hr}=state.core,shift=currentShift(),mode=attendanceMode(),bonus=logs.bonus_details?.[0],target=Number(bonus?.target||0),orders=Number((bonus?.orders ?? logs.month_orders) || 0),pct=target?Math.min(100,Math.round(orders/target*100)):0;const alerts=[];(hr.risks||[]).forEach(x=>alerts.push({icon:'⚠️',text:x,type:'orange'}));(hr.notes||[]).slice(0,1).forEach(x=>alerts.push({icon:'📝',text:x.note,type:'blue'}));return `<section class="view ${active('home')}" id="view-home"><p class="eyebrow">${t("home")}</p><h1 class="page-title">${esc(c.name||t("home"))}</h1><p class="page-lead">${t("homeLead")}</p><article class="shift-hero"><div class="row"><span class="status-pill ${c.shift_active?'green':'gray'}">${c.shift_active?t("checkedIn"):t("attendance")}</span>${shift?.overnight?statusPill(t("overnight"),'orange'):''}</div><p class="small" style="margin:15px 0 0;color:#aebfd0">${t("currentShift")}</p><h2 class="shift-title">${shift?esc(shift.name):t("noShift")}</h2><p class="shift-meta">${shift?`${esc(shift.start_time||'—')} — ${esc(shift.end_time||'—')} · ${esc(shift.zone||'—')}`:t("askSupervisor")}</p><div class="hero-action">${shift?`<button class="btn ${mode==='out'?'outline':'primary'} full" id="attendanceAction" onclick="attendanceAction()" ${state.busy.has('attendance')?'disabled':''}>${state.busy.has('attendance')?(mode==='out'?t('checkingOut'):t('checkingIn')):(mode==='out'?t('checkOut'):t('checkIn'))}</button>`:`<button class="btn outline full" onclick="go('shifts')">${t("viewDetails")}</button>`}</div></article><div class="metric-grid"><article class="metric"><span class="metric-label">${t("todayOrders")}</span><b class="metric-value orange">${Number(logs.today_orders||0)}</b></article><article class="metric"><span class="metric-label">${t("monthOrders")}</span><b class="metric-value green">${Number(logs.month_orders||0)}</b></article><article class="metric"><span class="metric-label">${t("target")}</span><b class="metri   function renderShifts(){const {courier:c}=state.core,shift=currentShift(),mode=attendanceMode();return `<section class="view ${active('shifts')}" id="view-shifts"><p class="eyebrow">${t("shifts")}</p><h1 class="page-title">${t("shiftDetails")}</h1><p class="page-lead">${lang==='ar'?'التوقيت والحضور من الوردية المسندة لك.':'Your assigned shift and attendance status.'}</p>${shift?`<article class="card dark"><div class="row"><b>${esc(shift.name)}</b>${statusPill(c.shift_active?t('checkedIn'):t('open'),c.shift_active?'green':'gray')}</div><div class="divider" style="background:rgba(255,255,255,.13)"></div><div class="data-list"><div class="data-row"><span>${t("start")}</span><b>${esc(shift.start_time||'—')}</b></div><div class="data-row"><span>${t("end")}</span><b>${esc(shift.end_time||'—')}</b></div><div class="data-row"><span>${lang==='ar'?'المنطقة':'Zone'}</span><b>${esc(shift.zone||'—')}</b></div><div class="data-row"><span>${lang==='ar'?'المدة':'Duration'}</span><b>${esc(shift.duration_hours||'—')} ${lang==='ar'?'ساعة':'hours'}</b></div></div>${shift.overnight?`<p class="small" style="color:#ffb292;margin:12px 0 0">${t("overnight")}</p>`:''}</article><article class="card"><h3 class="section-title" style="margin-top:0">${t("attendance")}</h3><div class="row"><div><b>${c.shift_active?t("checkedIn"):t("notAvailable")}</b><p class="tiny muted" style="margin:5px 0 0">${c.shift_active?(lang==='ar'?'استخدم زر الانصراف عند نهاية الوردية.':'Use check out when your shift ends.'):t("checkIn")}</p></div>${statusPill(c.is_online?t('online'):t('offlineStatus'),c.is_online?'green':'gray')}</div><div class="safe-gap"></div><button class="btn ${mode==='out'?'success':'primary'} full" onclick="attendanceAction()" ${state.busy.has('attendance')?'disabled':''}>${state.busy.has('attendance')?(mode==='out'?t('checkingOut'):t('checkingIn')):(mode==='out'?t('checkOut'):t('checkIn'))}</button></article>`:`<article class="card"><div class="empty"><span class="empty-icon">◷</span><b>${t("n   function projectOptions(){if(!state.projects)return `<option value="">${lang==='ar'?'جارِ تحميل المشاريع…':'Loading projects…'}</option>`;const rows=state.projects.filter(p=>p.is_current);return rows.length?rows.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(''):`<option value="">${t("noProject")}</option>`}

e" type="text"></div><div class="field"><label for="employeeRequestDetails">${t("requestDetails")}</label><textarea id="employeeRequestDetails"></textarea></div><button class="btn outline full" onclick="sendEmployeeRequest()" ${state.busy.has('employee')?'disabled':''}>${state.busy.has('employee')?t('saving'):t('sendRequest')}</button></div></article><article class="card"><h3 class="section-title" style="margin-top:0">${t("security")}</h3><div class="form-grid"><div class="field"><label for="currentPassword">${t("currentPassword")}</label><input id="currentPassword" type="password" autocomplete="current-password"></div><div class="field"><label for="newPassword">${t("newPassword")}</label><input id="newPassword" type="password" autocomplete="new-password"></div><button class="btn ghost full" onclick="changePassword()" ${state.busy.has('password')?'disabled':''}>${state.busy.has('password')?t('saving'):t('changePassword')}</button><button class="btn danger full" onclick="logout()">${t("logout")}</button></div></article>`}
  function renderNav(){const items=[['home','⌂',t('home')],['shifts','◷',t('shifts')],['performance','◉',t('performance')],['earnings','₪',t('earnings')],['profile','◌',t('profile')]];return `<nav class="bottom-nav" aria-label="${t('brand')}">${items.map(([key,icon,label])=>`<button class="nav-btn ${state.view===key?'active':''}" onclick="go('${key}')" aria-current="${state.view===key?'page':'false'}"><span>${icon}</span><span>${label}</span></button>`).join('')}</nav>`}
  function wireEmployeeRequestFields(){const type=$('employeeRequestType');if(!type||$('employeeProject'))return;const projects=(state.projects||[]).filter(p=>!p.is_current&&p.is_active);type.closest('.field').insertAdjacentHTML('afterend',`<div class="field" id="employeeProjectField"><label for="employeeProject">${lang==='ar'?'المشروع المطلوب':'Requested project'}</label><select id="employeeProject"><option value="">${lang==='ar'?'اختر المشروع':'Select project'}</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" id="employeeAmountField"><label for="employeeAmount">${lang==='ar'?'المبلغ المطلوب':'Requested amount'}</label><input id="employeeAmount" type="number" min="0" step="0.01" inputmode="decimal"></div>`);const sync=()=>{$('employeeProjectField').style.display=type.value==='PROJECT_TRANSFER'?'grid':'none';$('employeeAmountField').style.display=type.value==='ADVANCE'?'grid':'none'};type.addEventListener('change',sync);sync()}
  function wireDocumentBusy(){if(!state.busy.has('document'))return;document.querySelectorAll("button[onclick^=\"pickDocument\"]").forEach(button=>{button.disabled=true;button.textContent=lang==='ar'?'جارِ رفع المستند…':'Uploading document…'})}
  function go(view,push=true){state.view=view;render();wireEmployeeRequestFields();if(push){history.pushState({view},'',location.href)}if(view==='profile'){ensureExtras();ensureProjects()}if(view==='performance')ensureProjects()}
  async function attendanceAction(){const mode=attendanceMode();if(mode==='none'){go('shifts');return}setBusy('attendance',true);try{const locationData=await getLocation();const result=await api(mode==='out'?'/shifts/attendance/check-out':'/shifts/attendance/check-in',{method:'POST',body:JSON.stringify({courier_id:state.core.courier.id,lat:locationData.lat,lng:locationData.lng})});await loadCore();render();showToast(mode==='out'?t('successCheckout'):(result.already_checked_in?t('alreadyCheckin'):t('successCheckin')),'success')}catch(error){if(error?.locationError)showToast(error.message,'error');else actionError(error)}finally{state.busy.delete('attendance');render()}}
  function getLocation(){return new Promise((resolve,reject)=>{const fail=message=>{const error=new Error(message);error.locationError=true;reject(error)};if(!navigator.geolocation){fail(lang==='ar'?'هذا الجهاز لا يدعم تحديد الموقع. استخدم جهازًا يدعم GPS.':'This device does not support location. Use a GPS-enabled device.');return}navigator.geolocation.getCurrentPosition(position=>{const lat=Number(position.coords.latitude),lng=Number(position.coords.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<-90||lat>90||lng<-180||lng>180){fail(lang==='ar'?'تعذر الحصول على موقع صالح. افتح GPS ثم أعد المحاولة.':'A valid location could not be obtained. Turn on GPS and try again.');return}resolve({lat:+lat.toFixed(6),lng:+lng.toFixed(6)})},error=>{if(error?.code===1)fail(lang==='ar'?'اسمح لتطبيق DOU بالوصول إلى الموقع ثم أعد المحاولة.':'Allow DOU to access your location, then try again.');else if(error?.code===3)fail(lang==='ar'?'استغرق تحديد الموقع وقتًا طويلًا. افتح GPS وانتقل لمكان مكشوف ثم أعد المحاولة.':'Location timed out. Turn on GPS, move to an open area, and try again.');else fail(lang==='ar'?'تعذر تحديد موقعك. تأكد من تشغيل GPS ثم أعد المحاولة.':'Your location is unavailable. Make sure GPS is on, then try again.')},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})})}
  async function saveLog(){const projectId=Number($('logProject')?.value),orders=Number($('logOrders')?.value||0),logDate=$('logDate')?.value;if(!projectId||!logDate||orders<0){showToast(t('genericError'),'error');return}setBusy('log',true);try{await api('/hr/me/log',{method:'POST',body:JSON.stringify({log_date:logDate,project_id:projectId,orders_count:orders,notes:$('logNote')?.value||''})});await loadCore();render();showToast(t('saved'),'success')}catch(error){actionError(error)}finally{state.busy.delete('log');render()}}
  async function sendLeave(){const from=$('leaveFrom')?.value,to=$('leaveTo')?.value,reason=$('leaveReason')?.value?.trim();if(!from||!to||!reason){showToast(t('genericError'),'error');return}setBusy('leave',true);try{await api('/hr/me/leave',{method:'POST',body:JSON.stringify({from_date:from,to_date:to,reason})});state.extras=null;await ensureExtras();showToast(t('sent'),'success')}catch(error){actionError(error)}finally{state.busy.delete('leave');render()}}
  async function sendTicket(){const subject=$('ticketSubject')?.value?.trim(),message=$('ticketMessage')?.value?.trim();if(!subject||!message){showToast(t('genericError'),'error');return}setBusy('ticket',true);try{await api('/couriers/me/tickets',{method:'POST',body:JSON.stringify({subject,message})});state.extras=null;await ensureExtras();showToast(t('sent'),'success')}catch(error){actionError(error)}finally{state.busy.delete('ticket');render()}}
  async function sendEmployeeRequest(){const request_type=$('employeeRequestType')?.value,title=$('employeeRequestTitle')?.value?.trim(),details=$('employeeRequestDetails')?.value?.trim(),project_id=Number($('employeeProject')?.value||0)||null,amount=Number($('employeeAmount')?.value||0)||null;if(!title||!details||(request_type==='PROJECT_TRANSFER'&&!project_id)){showToast(t('genericError'),'error');return}setBusy('employee',true);try{await api('/hr/employee-requests',{method:'POST',body:JSON.stringify({request_type,title,details,project_id,amount})});showToast(t('sent'),'success')}catch(error){actionError(error)}finally{state.busy.delete('employee');render();wireEmployeeRequestFields()}}
  async function pickDocument(source){if(state.busy.has('document'))return;const type=$('documentType')?.value||'IQAMA';const input=document.createElement('input');input.type='file';input.accept=source==='camera'?'image/*':'image/jpeg,image/png,application/pdf';if(source==='camera')input.capture='environment';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;if(file.size>1024*1024){showToast(t('documentSize'),'error');return}setBusy('document',true);try{const data=await readFile(file);await api('/hr/me/documents',{method:'POST',body:JSON.stringify({document_type:type,filename:file.name,mime_type:file.type,file_data:data})});state.extras=null;await ensureExtras();showToast(t('uploaded'),'success')}catch(error){actionError(error)}finally{state.busy.delete('document');render();wireEmployeeRequestFields()}};input.click()}
  function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
  async function changePassword(){const current_password=$('currentPassword')?.value,new_password=$('newPassword')?.value;if(!current_password||!new_password||new_password.length<8){showToast(t('genericError'),'error');return}setBusy('password',true);try{await api('/auth/change-password',{method:'POST',body:JSON.stringify({current_password,new_password})});clearSession(lang==='ar'?'تم تغيير كلمة المرور. سجّل الدخول مجدداً.':'Password changed. Sign in again.')}catch(error){actionError(error)}finally{state.busy.delete('password');render()}}
  async function logout(){const old=TOKEN;try{if(old)await fetch('/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+old}})}catch(_){}clearSession()}
  function renderInstallHelper(id){const mount=$(id);if(!mount||standalone())return;if(isIOS()){if(localStorage.getItem('dou_ios_install_dismissed'))return;mount.innerHTML=`<div class="install-helper"><b>${t('installIOS')}</b><br>${t('installIOSHelp')}<div class="btn-row" style="margin-top:9px"><button class="btn ghost compact" onclick="dismissIOSInstall()">${t('dismiss')}</button></div></div>`;return}if(state.deferredInstall){mount.innerHTML=`<div class="install-helper"><b>${t('installAndroid')}</b><div class="btn-row" style="margin-top:9px"><button class="btn ghost compact" onclick="installApp()">${t('install')}</button></div></div>`}}
  function dismissIOSInstall(){localStorage.setItem('dou_ios_install_dismissed','1');render()}
  async function installApp(){if(!state.deferredInstall)return;state.deferredInstall.prompt();try{await state.deferredInstall.userChoice}catch(_){}state.deferredInstall=null;render()}
  window.addEventListener('beforeinstallprompt',(event)=>{event.preventDefault();state.deferredInstall=event;render()});window.addEventListener('appinstalled',()=>{state.deferredInstall=null;render()});window.addEventListener('online',()=>{const bar=$('connection');if(bar){bar.textContent='✓ '+t('reconnected');bar.className='connection show online';setTimeout(()=>bar.className='connection',2500)}showToast(t('reconnected'),'success')});window.addEventListener('offline',()=>{const bar=$('connection');if(bar){bar.textContent='◌ '+t('offline');bar.className='connection show'}});window.addEventListener('popstate',(event)=>{if(event.state?.view){state.view=event.state.view;render()}});
  if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{await navigator.serviceWorker.register('/sw.js',{scope:'/driver'});const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(registration=>new URL(registration.scope).pathname==='/static/').map(registration=>registration.unregister()))}catch(_){}})}
  async function boot(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';if(!TOKEN){renderLogin();return}const role=localStorage.getItem('dou_role_courier');if(role&&role!=='COURIER'){clearSession();return}try{await loadCore();history.replaceState({view:state.view},'',location.href);render()}catch(error){if(error.status===401){clearSession(t('sessionExpired'))}else if(error.status===403){state.accessBlocked=true;blockedView()}else{renderLogin(error.status===0?t('networkError'):t('genericError'))}}}
  Object.assign(window,{toggleLang,doLogin,go,refreshCore,attendanceAction,saveLog,sendLeave,sendTicket,sendEmployeeRequest,pickDocument,changePassword,logout,installApp,dismissIOSInstall,clearSession});
  boot();
  </script>
