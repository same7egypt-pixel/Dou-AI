  <title>DOU Rider | غرفة قيادة المندوب</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192.png">

  <style>
    :root[data-theme="dark"]{
      --bg:#090d13;--surface:#111722;--surface2:#182232;--surface3:#222f42;
      --ink:#f0f4f8;--ink2:#9bb0c6;--muted:#667d97;--line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
      --orange:#ff5a13;--orange-soft:rgba(255,90,19,.14);--orange-glow:rgba(255,90,19,.28);
      --green:#10b981;--green-soft:rgba(16,185,129,.14);--green-glow:rgba(16,185,129,.28);
      --blue:#3b82f6;--blue-soft:rgba(59,130,246,.14);
      --amber:#f59e0b;--amber-soft:rgba(245,158,11,.14);
      --red:#ef4444;--red-soft:rgba(239,68,68,.14);
      --shadow:0 12px 36px rgba(0,0,0,.45);--card-shadow:0 4px 20px rgba(0,0,0,.25);
    }
    :root[data-theme="light"]{
      --bg:#f4f6f9;--surface:#ffffff;--surface2:#f8fafc;--surface3:#edf2f7;
      --ink:#0f172a;--ink2:#475569;--muted:#64748b;--line:#e2e8f0;--line-strong:#cbd5e1;
      --orange:#ea580c;--orange-soft:#fff7ed;--orange-glow:rgba(234,88,12,.2);
      --green:#059669;--green-soft:#ecfdf5;--green-glow:rgba(5,150,105,.2);
      --blue:#2563eb;--blue-soft:#eff6ff;
      --amber:#d97706;--amber-soft:#fffbeb;
      --red:#dc2626;--red-soft:#fef2f2;
      --shadow:0 12px 36px rgba(15,23,42,.08);--card-shadow:0 4px 16px rgba(15,23,42,.04);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Alexandria,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}
    a{color:inherit;text-decoration:none}
    
    .app-shell{min-height:100dvh;max-width:540px;margin:0 auto;background:var(--bg);position:relative;padding-top:max(0px,env(safe-area-inset-top));padding-bottom:max(88px,calc(76px + env(safe-area-inset-bottom)));box-shadow:0 0 60px rgba(0,0,0,.35)}
    
    /* TOPBAR */
    .topbar{min-height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
    .brand-wrap{display:flex;gap:10px;align-items:center}
    .brand-logo{font-size:22px;font-weight:900;letter-spacing:-1.2px;color:var(--ink);display:flex;align-items:center;gap:3px}
    .brand-dot{display:inline-block;width:12px;height:12px;background:var(--orange);border-radius:4px}
    .brand-badge{font-size:9px;background:var(--orange-soft);color:var(--orange);font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.5px}
    .driver-name{font-size:12px;font-weight:700;color:var(--ink);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .driver-hub{font-size:10px;color:var(--muted)}
    
    .top-actions{display:flex;align-items:center;gap:6px}
    .icon-btn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-height:36px;min-width:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 8px}
    .icon-btn.sos{background:var(--red-soft);color:var(--red);border-color:rgba(239,68,68,.3);font-weight:800}
    
    /* STATUS BANNER */
    .connection{display:none;align-items:center;justify-content:center;gap:8px;background:var(--amber-soft);color:var(--amber);font-size:11px;font-weight:700;padding:8px 16px}
    .connection.show{display:flex}
    .connection.online{background:var(--green-soft);color:var(--green)}
    
    /* QUICK ACTIONS STRIP */
    .quick-strip{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
    .quick-strip::-webkit-scrollbar{display:none}
    .quick-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-size:11px;font-weight:700;color:var(--ink2)}
    .quick-chip.active{background:var(--orange-soft);color:var(--orange);border-color:rgba(255,90,19,.3)}
    
    /* MAIN CONTAINER & VIEWS */
    main{padding:0 16px 16px}
    .view{display:none;animation:viewFadeIn .18s cubic-bezier(.2,.8,.2,1)}
    .view.active{display:block}
    @keyframes viewFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    
    .eyebrow{margin:0 0 4px;color:var(--orange);font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
    .page-title{margin:0 0 6px;font-size:22px;line-height:1.2;font-weight:900;letter-spacing:-.6px}
    .page-lead{margin:0 0 16px;color:var(--muted);font-size:12px;line-height:1.6}
    .section-title{font-size:13px;font-weight:800;margin:20px 0 10px;color:var(--ink);display:flex;align-items:center;justify-content:space-between}
    
    /* CARDS */
    .card{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--card-shadow)}
    .card.dark-hero{background:linear-gradient(135deg,#0d131d 0%,#182333 100%);border:1px solid rgba(255,255,255,.1);color:#fff;position:relative;overflow:hidden}
    .card.dark-hero::after{content:"";position:absolute;top:-50px;left:-50px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,90,19,.18) 0%,transparent 70%);border-radius:50%;pointer-events:none}
    .card.subtle{background:var(--surface2);border-color:var(--line)}
    .card.glow-green{border-color:rgba(16,185,129,.4);box-shadow:0 0 24px rgba(16,185,129,.12)}
    .card.glow-orange{border-color:rgba(255,90,19,.4);box-shadow:0 0 24px rgba(255,90,19,.12)}
    
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .muted{color:var(--muted)}
    .tiny{font-size:10px}
    .small{font-size:11px}
    .strong{font-weight:800}
    .mono{font-family:'JetBrains Mono',monospace}
    
    /* STATUS PILLS */
    .status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:10px;font-weight:800;white-space:nowrap}
    .status-pill.green{background:var(--green-soft);color:var(--green)}
    .status-pill.orange{background:var(--orange-soft);color:var(--orange)}
    .status-pill.blue{background:var(--blue-soft);color:var(--blue)}
    .status-pill.amber{background:var(--amber-soft);color:var(--amber)}
    .status-pill.red{background:var(--red-soft);color:var(--red)}
    .status-pill.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
    
    /* BUTTONS */
    .btn{border:0;min-height:48px;border-radius:14px;padding:10px 16px;font-size:13px;font-weight:800;transition:transform .12s cubic-bezier(.23,1,.32,1),box-shadow .12s,background .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn:active{transform:scale(.97)}
    .btn.primary{background:var(--orange);color:#fff;box-shadow:0 8px 24px var(--orange-glow)}
    .btn.success{background:var(--green);color:#fff;box-shadow:0 8px 24px var(--green-glow)}
    .btn.danger{background:var(--red);color:#fff}
    .btn.danger-soft{background:var(--red-soft);color:var(--red);border:1px solid rgba(239,68,68,.3)}
    .btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
    .btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
    .btn.full{width:100%}
    .btn.compact{min-height:36px;padding:6px 12px;font-size:11px;border-radius:10px}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap}
    .btn-row .btn{flex:1;min-width:120px}
    
    /* SHIFT HERO */
    .hero-shift-badge{font-size:10px;font-weight:800;letter-spacing:.5px;color:#cbd5e1;text-transform:uppercase}
    .hero-shift-title{font-size:20px;font-weight:900;margin:6px 0 8px;line-height:1.3;color:#fff}
    .hero-shift-meta{font-size:11px;color:#94a3b8;line-height:1.7;display:flex;flex-wrap:wrap;gap:10px}
    .hero-action-box{margin-top:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);padding:14px;border-radius:16px}
    
    /* STATUS SWITCHER TABS */
    .status-switcher{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border:1px solid var(--line);padding:4px;border-radius:14px;margin:12px 0}
    .status-opt{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:10px;font-size:10px;font-weight:800;text-align:center;transition:all .14s}
    .status-opt.active.online{background:var(--green-soft);color:var(--green)}
    .status-opt.active.break{background:var(--amber-soft);color:var(--amber)}
    .status-opt.active.delivery{background:var(--orange-soft);color:var(--orange)}
    .status-opt.active.offline{background:var(--surface3);color:var(--ink)}
    
    /* METRICS GRID */
    .metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
    .metric-box{background:var(--surface);border:1px solid var(--line);padding:14px;border-radius:16px}
    .metric-box .label{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:6px}
    .metric-box .val{font-size:22px;line-height:1;font-weight:900;letter-spacing:-.5px}
    
    /* PROGRESS BAR */
    .progress-track{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
    .progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--orange),#ff8347);transition:width .35s cubic-bezier(.23,1,.32,1)}
    .progress-fill.green{background:linear-gradient(90deg,var(--green),#34d399)}
    
    /* SUPERVISOR CARD */
    .sup-avatar{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:16px;font-weight:800}
    .sup-actions{display:flex;gap:6px}
    
    /* DATA LIST */
    .data-list{display:grid;gap:0}
    .data-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
    .data-row:last-child{border-bottom:0}
    .data-row b{text-align:end;max-width:60%;word-break:break-word}
    
    /* FORM GRID */
    .form-grid{display:grid;gap:10px}
    .field{display:grid;gap:5px}
    .field label{font-size:11px;font-weight:800;color:var(--ink2)}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface2);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
    .field textarea{min-height:80px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
    .form-note{font-size:10px;color:var(--muted);line-height:1.6}
    .divider{height:1px;background:var(--line);margin:14px 0}
    
    /* BOTTOM NAVIGATION */
    .bottom-nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);padding:6px 10px max(6px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
    .nav-btn{border:0;background:transparent;color:var(--muted);padding:6px 2px 4px;min-height:50px;border-radius:12px;font-size:9px;font-weight:800;display:grid;place-items:center;gap:2px;transition:all .14s}
    .nav-btn .icon{font-size:18px;line-height:1}
    .nav-btn.active{color:var(--orange);background:var(--orange-soft)}
    
    /* TOAST */
    .toast{position:fixed;z-index:90;bottom:calc(82px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);width:min(calc(100% - 32px),400px);padding:12px 16px;border-radius:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);font-size:12px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s cubic-bezier(.23,1,.32,1)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .toast.success{background:var(--green);color:#fff;border-color:transparent}
    .toast.error{background:var(--red);color:#fff;border-color:transparent}
    
    /* MODALS */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:80;display:grid;place-items:center;padding:16px;animation:modalFade .15s}
    .modal-sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:24px;width:min(100%,480px);max-height:90dvh;overflow-y:auto;padding:20px;box-shadow:var(--shadow)}
    @keyframes modalFade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
    
    /* EMPTY & SKELETON */
    .empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:12px;line-height:1.7}
    .empty-icon{font-size:28px;display:block;margin-bottom:6px}
    .skeleton{border-radius:14px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 38%,var(--surface) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;height:64px;margin-bottom:10px}
    @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
    
    /* PAYSLIP PRINT STYLES */
    @media print{
      body{background:#fff!important;color:#000!important}
      .topbar,.bottom-nav,.top-actions,.btn-row,button{display:none!important}
      .app-shell{box-shadow:none!important;max-width:100%!important;padding:0!important}
      .card{border:1px solid #000!important;box-shadow:none!important}
    }
  </style>
</head>

    clearTimeout(state.toastTimer);

  async function api(path, opts={}){
    if(!navigator.onLine){const e=new Error(t("networkError"));e.status=0;throw e}
    const headers={...(opts.headers||{})};
    if(opts.body&&!headers["Content-Type"]) headers["Content-Type"]="application/json";
    if(TOKEN) headers.Authorization="Bearer "+TOKEN;
    let response;
    try{response=await fetch(API+path,{...opts,headers})}
    catch(_){const e=new Error(t("networkError"));e.status=0;throw e}
    if(!response.ok){
      let detail="";try{detail=(await response.json()).detail||""}catch(_){}
      const e=new Error(detail||t("genericError"));e.status=response.status;throw e;
    }
    if(response.status===204) return null;
    return response.json();
  }

  async function doLogin(){
    const phone = $('loginPhone').value.trim();
    const password = $('loginPassword').value;
    const btn = $('loginButton');
    if(!phone || !password){showToast(t("genericError"),"error");return}
    btn.disabled=true;btn.textContent=t("loggingIn");
    try{
      const res = await api('/auth/login',{method:'POST',body:JSON.stringify({phone,password})});
      if(res.role!=="COURIER") throw new Error("هذا الحساب غير مصرح له كتطبيق سائق");
      TOKEN = res.access_token;
      localStorage.setItem("dou_token_courier", TOKEN);
      localStorage.setItem("dou_role_courier", res.role);
      await loadCore();
      render();
    }catch(err){
      btn.disabled=false;btn.textContent=t("login");
      showToast(err.message||t("genericError"),"error");
    }
  }

  /* ACTIONS & HANDLERS */
  async function attendanceAction(){
    const mode = attendanceMode();
    if(mode==='none'){go('shifts');return}
    setBusy('attendance', true);
    try{
      const pos = await getLocation();
      const endpoint = mode==='out' ? '/shifts/attendance/check-out' : '/shifts/attendance/check-in';
      const res = await api(endpoint, {
        method:'POST',
        body:JSON.stringify({courier_id:state.core.courier.id, lat:pos.lat, lng:pos.lng})
      });
      await loadCore();
      render();
      showToast(mode==='out' ? t('successCheckout') : (res.already_checked_in ? t('alreadyCheckin') : t('successCheckin')), 'success');
    }catch(err){
      showToast(err.message||t('genericError'), 'error');
    }finally{
      state.busy.delete('attendance');
      render();
    }
  }

  function getLocation(){
    return new Promise((resolve, reject)=>{
      if(!navigator.geolocation) return reject(new Error("جهازك لا يدعم نظام تحديد الموقع GPS"));
      navigator.geolocation.getCurrentPosition(
        p => resolve({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}),
        e => reject(new Error("تعذر تحديد موقع GPS. يرجى تفعيل الموقع والمحاولة مجدداً")),
        {enableHighAccuracy:true, timeout:15000, maximumAge:30000}
      );
    });
  }

  async function setDriverStatus(newStatus){
    state.driverStatus = newStatus;
    render();
    try{
      await api('/couriers/me/status', {
        method:'POST',
        body:JSON.stringify({status:newStatus})
      });
      showToast(`تم تحديث حالتك إلى: ${t('status'+newStatus.charAt(0)+newStatus.slice(1).toLowerCase()) || newStatus}`, 'success');
    }catch(e){}
  }

  async function claimShiftAction(shiftId){
    setBusy('shift', true);
    try{
      await api(`/shifts/${shiftId}/claim`, {method:'POST'});
      await loadCore();
      render();
      showToast(t('claimSuccess'), 'success');

    finally{state.busy.delete('shift');render()}

  async function dropShiftAction(shiftId){

  async function saveLog(){
    const projectId = Number($('logProject')?.value);
    const orders = Number($('logOrders')?.value || 0);
    const logDate = $('logDate')?.value;
    if(!projectId || !logDate || orders < 0){
      showToast("يرجى إدخال كافة الحقول بشكل صحيح", "error");
      return;
    }
    setBusy('log', true);
    try{
      await api('/hr/me/log', {
        method:'POST',
        body:JSON.stringify({log_date:logDate, project_id:projectId, orders_count:orders, notes:$('logNote')?.value||''})
      });
      await loadCore();
      render();
      showToast(t('saved'), 'success');
    }catch(err){showToast(err.message, 'error')}
    finally{state.busy.delete('log');render()}
  }

  /* IN-BROWSER CAMERA & IMAGE COMPRESSION */
  async function pickDocument(source){
    const type = $('docType')?.value || 'IQAMA';
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = source==='camera' ? 'image/*' : 'image/jpeg,image/png,application/pdf';
    if(source==='camera') input.capture = 'environment';
    input.onchange = async()=>{
      const file = input.files?.[0];
      if(!file) return;
      showToast("جارِ ضغط ومعالجة الصورة…");
      try{
        const base64Data = await compressImage(file);
        await api('/hr/me/documents', {
          method:'POST',
          body:JSON.stringify({document_type:type, filename:file.name, mime_type:'image/jpeg', file_data:base64Data})
        });
        state.extras = null;
        await ensureExtras();
        showToast(t('uploaded'), 'success');
      }catch(err){showToast(err.message, 'error')}
    };
    input.click();
  }

  function compressImage(file){
    return new Promise((resolve, reject)=>{
      if(file.type === 'application/pdf'){
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
        return;
      }
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = ()=>{
        URL.revokeObjectURL(img.src);
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 1280;
        const MAX_HEIGHT = 1280;
        let width = img.width;
        let height = img.height;
        if(width > height){
          if(width > MAX_WIDTH){height *= MAX_WIDTH / width; width = MAX_WIDTH;}
        } else {
          if(height > MAX_HEIGHT){width *= MAX_HEIGHT / height; height = MAX_HEIGHT;}
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
    });
  }
