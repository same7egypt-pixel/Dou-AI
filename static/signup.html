<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجّل شركتك — DOU Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#11161d;font-family:Alexandria,sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:42px;font-weight:800;letter-spacing:-3px;direction:ltr;text-align:center;margin-bottom:6px}
.logo i{display:inline-block;background:#ff5a13;height:12px;width:30px;border-radius:8px;margin:0 3px 12px 0}
.title{font-size:19px;font-weight:700;margin-bottom:6px;text-align:center}
.sub{color:#8b94a3;font-size:13px;margin-bottom:26px;text-align:center}
.card{background:#1b2330;border:1px solid #273245;border-radius:18px;padding:28px;width:100%;max-width:400px}
label{display:block;font-size:12px;color:#8b94a3;margin:14px 0 6px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #273245;background:#11161d;color:#fff;font-family:inherit;font-size:14px;outline:none}
input:focus,select:focus{border-color:#ff5a13}
.btn{display:block;width:100%;padding:13px;margin-top:20px;background:#ff5a13;border:0;border-radius:10px;color:#fff;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.9}
.msg.ok{display:block;background:#0d2418;border:1px solid #1f7a45;color:#7ef0a8}
.msg.err{display:block;background:#2a1210;border:1px solid #8f2c1f;color:#ff9a8a}
.msg b{font-size:13px}
.back{margin-top:20px;color:#8b94a3;font-size:12px;text-decoration:none}
.back:hover{color:#fff}
.hint{color:#5b6575;font-size:11px;margin-top:10px;line-height:1.8}
.copy{display:inline-block;background:#11161d;border:1px solid #273245;color:#fff;padding:3px 10px;border-radius:8px;font-size:11px;margin:2px;cursor:pointer;font-family:inherit}
.copy:hover{border-color:#ff5a13}
.nextbtn{display:none;width:100%;padding:13px;margin-top:16px;background:#fff;color:#11161d;border:0;border-radius:10px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none}
.nextbtn:hover{background:#ff5a13;color:#fff}
.copy{display:inline-block;background:#11161d;border:1px solid #273245;color:#fff;padding:3px 10px;border-radius:8px;font-size:11px;margin:2px;cursor:pointer;font-family:inherit}
.copy:hover{border-color:#ff5a13}
.nextbtn{display:none;width:100%;padding:13px;margin-top:16px;background:#fff;color:#11161d;border:0;border-radius:10px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none}
.nextbtn:hover{background:#ff5a13;color:#fff}
</style>
</head>
<body>
<div class="logo">D<i></i>ou</div>
<div class="title">سجّل شركتك اللوجستية</div>
<div class="sub">تجربة مجانية ١٤ يوماً — بيانات الدخول تتولد تلقائياً ويفتح حسابك مباشرة</div>
<div class="card">
  <form id="regForm">
    <label>اسم الشركة</label>
    <input id="compName" type="text" placeholder="مثال: شركة الأمانة للنقل" required>
    <label>رقم الجوال (Arabic digits بلا ٠ أو ٠+)</label>
    <input id="compPhone" type="tel" dir="ltr" placeholder="9665xxxxxxxx" required>
    <label>كلمة المرور (8 أحرف على الأقل)</label>
    <input id="compPassword" type="password" dir="ltr" minlength="8" placeholder="اختر كلمة مرور قوية" required>
    <label>البلد</label>
    <select id="compCountry">
      <option value="SA">السعودية 🇸🇦</option>
      <option value="EG">مصر 🇪🇬</option>
    </select>
    <button class="btn" id="regBtn" type="submit">إنشاء الحساب والدخول</button>
  </form>
  <a class="nextbtn" id="nextBtn" href="/static/fleet.html">اذهب لصفحة الدخول وسجّل بنفسك →</a>
  <div class="msg" id="regMsg"></div>
  <div class="hint">تسجّل الشركة كيانات لعملائنا؟ بيانات الدخول تُنسخ هنا وتنقلها إلى العميل، أو يغيّر كلمة المرور لاحقاً</div>
</div>
<a class="back" href="/static/fleet.html">← العودة لصفحة دخول الشركات</a>
<script>
async function copyVal(v){
  try{ await navigator.clipboard.writeText(v); }catch(e){}
  const c = event.target; c.textContent = "✓"; setTimeout(()=>c.textContent="نسخ", 1200);
}
async function normalizePhone(p){
  let ph = p.trim().replace(/\D/g,"");
  if(/^0\d{9}$/.test(ph)) ph = ph.replace(/^0/,"");          // 010xxxx -> 10xxxx
  if(/^5\d{8}$/.test(ph)) ph = "966"+ph;                       // سعودي محلي
  if(/^1\d{9}$/.test(ph)) ph = "20"+ph;                        // مصري محلي
  return ph;
}
const form = document.getElementById("regForm");
const btn = document.getElementById("regBtn");
const msg = document.getElementById("regMsg");
form.addEventListener("submit", async function(e){
  e.preventDefault();
  btn.disabled = true; btn.textContent = "جارٍ إنشاء الحساب…";
  msg.className = "msg"; msg.innerHTML = "";
  try {
    const phone = await normalizePhone(document.getElementById("compPhone").value);
    const password = document.getElementById("compPassword").value;
    const res = await fetch("/auth/company-register", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:document.getElementById("compName").value.trim(), phone, password, country:document.getElementById("compCountry").value})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "حدث خطأ");
    const due = data.due_date ? new Date(data.due_date).toLocaleDateString("ar-EG") : "";
    form.style.display = "none";
    msg.className = "msg ok";
    msg.innerHTML = "✅ تم إنشاء الحساب! <b>"+data.company_name+"</b><br>رقم الدخول: <b dir='ltr'>"+data.login_phone+"</b> <button class='copy' onclick=\"copyVal('"+data.login_phone+"')\">نسخ</button><br>الخطة: تجربة مجانية"+(due?" — تنتهي "+due:"")+"<br><b>تقدر تسجّل الدخول الآن بكلمة المرور اللي اخترتها.</b>";
    const nb = document.getElementById("nextBtn");
    nb.style.display = "block";
    nb.href = "/static/fleet.html";
    btn.disabled = false; btn.textContent = "إنشاء الحساب والدخول";
  } catch(err){
    msg.className = "msg err";
    msg.innerHTML = "⚠️ "+err.message;
    btn.disabled = false; btn.textContent = "إنشاء الحساب والدخول";
  }
});
</script>
</body>
</html>
