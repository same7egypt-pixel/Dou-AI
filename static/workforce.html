<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الفرق والمناطق — DOU</title>
<style>
:root{--bg:#0b1020;--panel:#141b2d;--line:#27324b;--text:#f5f7fb;--muted:#9da9c2;--blue:#4f8cff;--green:#35c58b;--danger:#ff6b79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif}.shell{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h1{margin:4px 0;font-size:28px}.muted{color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;cursor:pointer;font-weight:700}.btn.ghost{background:transparent;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.card h2{font-size:18px;margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form .wide{grid-column:1/-1}input,select{width:100%;background:#0d1425;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.list{display:grid;gap:8px;margin-top:14px;max-height:300px;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px;background:#0f1628;border:1px solid #202b43;border-radius:10px}.tag{font-size:12px;color:#d8e4ff;background:#243557;padding:4px 8px;border-radius:999px}.status{min-height:22px;margin:12px 0;color:var(--green)}.status.error{color:var(--danger)}.history{grid-column:1/-1}.empty{color:var(--muted);padding:14px;text-align:center}@media(max-width:800px){.grid,.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.history{grid-column:auto}}
</style>
</head>
<body><main class="shell">
<div class="top"><div><div class="muted" data-ar="هيكل القوى العاملة" data-en="Workforce structure">هيكل القوى العاملة</div><h1 data-ar="الفرق والمناطق" data-en="Teams & zones">الفرق والمناطق</h1><div class="muted" data-ar="إدارة النطاق التشغيلي، عضويات السائقين وتعيينات المشرفين بتاريخ نفاذ واضح." data-en="Manage operating scope, effective-dated rider memberships, and supervisor assignments.">إدارة النطاق التشغيلي، عضويات السائقين وتعيينات المشرفين بتاريخ نفاذ واضح.</div></div><div class="actions"><button class="btn ghost" onclick="toggleLanguage()">AR / EN</button><button class="btn ghost" onclick="location.href='/app'" data-ar="العودة للوحة" data-en="Back to dashboard">العودة للوحة</button></div></div>
<div id="status" class="status"></div>
<section class="grid">
<div class="card"><h2 data-ar="مناطق التشغيل" data-en="Operating zones">مناطق التشغيل</h2><div class="form"><select id="zoneCity" class="wide"></select><input id="zoneCode" placeholder="Code"><input id="zoneAr" placeholder="الاسم بالعربية"><input id="zoneEn" placeholder="English name"><button class="btn" onclick="createZone()" data-ar="إضافة منطقة" data-en="Add zone">إضافة منطقة</button></div><div id="zones" class="list"></div></div>
<div class="card"><h2 data-ar="فرق العمل" data-en="Workforce teams">فرق العمل</h2><div class="form"><select id="teamZone" class="wide"></select><input id="teamCode" placeholder="Code"><input id="teamAr" placeholder="الاسم بالعربية"><input id="teamEn" placeholder="English name"><button class="btn" onclick="createTeam()" data-ar="إضافة فريق" data-en="Add team">إضافة فريق</button></div><div id="teams" class="list"></div></div>
<div class="card"><h2 data-ar="نقل سائق إلى فريق" data-en="Transfer rider to team">نقل سائق إلى فريق</h2><div class="form"><select id="riderSelect" class="wide"></select><select id="riderTeam" class="wide"></select><input id="transferDate" type="date"><button class="btn" onclick="transferRider()" data-ar="تأكيد النقل" data-en="Confirm transfer">تأكيد النقل</button></div><p class="muted" data-ar="النقل يغلق العضوية السابقة في اليوم السابق ويحفظ التاريخ." data-en="Transfer closes the previous membership one day earlier and preserves history.">النقل يغلق العضوية السابقة في اليوم السابق ويحفظ التاريخ.</p></div>
<div class="card"><h2 data-ar="ربط مشرف بفريق" data-en="Assign supervisor to team">ربط مشرف بفريق</h2><div class="form"><select id="supervisorSelect" class="wide"></select><select id="supervisorTeam" class="wide"></select><input id="supervisorDate" type="date"><button class="btn" onclick="assignSupervisor()" data-ar="تأكيد التعيين" data-en="Confirm assignment">تأكيد التعيين</button></div></div>
<div class="card history"><h2 data-ar="العضويات والتعيينات" data-en="Membership & assignment history">العضويات والتعيينات</h2><div class="form"><select id="historyTeam" onchange="loadHistory()"></select><label><input id="includeHistory" type="checkbox" onchange="loadHistory()"> <span data-ar="عرض التاريخ الكامل" data-en="Show full history">عرض التاريخ الكامل</span></label></div><div id="history" class="list"></div></div>
</section></main>
<script>
const token=localStorage.getItem('dou_token_fleet');let lang=localStorage.getItem('dou_lang')||'ar';let state={zones:[],teams:[],riders:[],supervisors:[],cities:[]};
if(!token)location.href='/app';
async function api(path,options={}){const headers={'Content-Type':'application/json',Authorization:'Bearer '+token};const response=await fetch(path,{...options,headers});if(!response.ok){let message='Request failed';try{message=(await response.json()).detail||message}catch(_e){}throw new Error(message)}return response.json()}
function text(ar,en){return lang==='ar'?ar:en}function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function setStatus(message,error=false){const el=document.getElementById('status');el.textContent=message;el.className='status'+(error?' error':'')}
function optionRows(rows,label,empty){return '<option value="">'+esc(empty)+'</option>'+rows.map(row=>'<option value="'+row.id+'">'+esc(label(row))+'</option>').join('')}
function renderLanguage(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang]);render()}
function toggleLanguage(){lang=lang==='ar'?'en':'ar';localStorage.setItem('dou_lang',lang);renderLanguage()}
function render(){
 document.getElementById('zoneCity').innerHTML=optionRows(state.cities,r=>r.name,text('اختر مدينة التشغيل','Select operating city'));
 const zoneOptions=optionRows(state.zones,r=>(lang==='ar'?r.name_ar:r.name_en||r.name_ar),text('بدون منطقة','No zone'));
 ['teamZone'].forEach(id=>document.getElementById(id).innerHTML=zoneOptions);
 const teamOptions=optionRows(state.teams,r=>(lang==='ar'?r.name_ar:r.name_en||r.name_ar),text('اختر الفريق','Select team'));
 ['riderTeam','supervisorTeam','historyTeam'].forEach(id=>{const old=document.getElementById(id).value;document.getElementById(id).innerHTML=teamOptions;document.getElementById(id).value=old});
 document.getElementById('riderSelect').innerHTML=optionRows(state.riders,r=>r.name+' — '+r.phone,text('اختر السائق','Select rider'));
 document.getElementById('supervisorSelect').innerHTML=optionRows(state.supervisors,r=>r.name+' — '+r.phone,text('اختر المشرف','Select supervisor'));
 document.getElementById('zones').innerHTML=state.zones.length?state.zones.map(row=>'<div class="row"><b>'+esc(lang==='ar'?row.name_ar:row.name_en||row.name_ar)+'</b><span class="tag">'+esc(row.code)+'</span></div>').join(''):'<div class="empty">'+text('لا توجد مناطق','No zones')+'</div>';
 document.getElementById('teams').innerHTML=state.teams.length?state.teams.map(row=>'<div class="row"><button class="btn ghost" onclick="selectHistory('+row.id+')">'+esc(lang==='ar'?row.name_ar:row.name_en||row.name_ar)+'</button><span class="tag">'+esc(row.code)+'</span></div>').join(''):'<div class="empty">'+text('لا توجد فرق','No teams')+'</div>';
}
async function load(){try{const values=await Promise.all([api('/workforce/zones'),api('/workforce/teams'),api('/fleet/couriers'),api('/hr/supervisors'),api('/hr/operating-cities')]);[state.zones,state.teams,state.riders,state.supervisors,state.cities]=values;renderLanguage();setStatus(text('تم تحميل هيكل القوى العاملة','Workforce structure loaded'))}catch(error){setStatus(error.message,true)}}
async function createZone(){try{await api('/workforce/zones',{method:'POST',body:JSON.stringify({operating_city_id:Number(zoneCity.value),code:zoneCode.value,name_ar:zoneAr.value,name_en:zoneEn.value||null})});setStatus(text('تمت إضافة المنطقة','Zone added'));await load()}catch(error){setStatus(error.message,true)}}
async function createTeam(){try{await api('/workforce/teams',{method:'POST',body:JSON.stringify({zone_id:teamZone.value?Number(teamZone.value):null,code:teamCode.value,name_ar:teamAr.value,name_en:teamEn.value||null})});setStatus(text('تمت إضافة الفريق','Team added'));await load()}catch(error){setStatus(error.message,true)}}
async function transferRider(){try{await api('/workforce/riders/'+Number(riderSelect.value)+'/team-transfer',{method:'POST',body:JSON.stringify({team_id:Number(riderTeam.value),effective_on:transferDate.value})});setStatus(text('تم نقل السائق مع حفظ التاريخ','Rider transferred with history preserved'));await loadHistory()}catch(error){setStatus(error.message,true)}}
async function assignSupervisor(){try{await api('/workforce/teams/'+Number(supervisorTeam.value)+'/supervisors',{method:'POST',body:JSON.stringify({supervisor_id:Number(supervisorSelect.value),effective_from:supervisorDate.value})});setStatus(text('تم ربط المشرف بالفريق','Supervisor assigned'));await loadHistory()}catch(error){setStatus(error.message,true)}}
function selectHistory(id){historyTeam.value=String(id);loadHistory()}
async function loadHistory(){const id=Number(historyTeam.value);if(!id){history.innerHTML='';return}const all=includeHistory.checked?'?include_history=true':'';try{const [members,supervisors]=await Promise.all([api('/workforce/teams/'+id+'/memberships'+all),api('/workforce/teams/'+id+'/supervisors'+all)]);const riderNames=Object.fromEntries(state.riders.map(row=>[row.id,row.name]));const supervisorNames=Object.fromEntries(state.supervisors.map(row=>[row.id,row.name]));const rows=members.map(row=>'<div class="row"><span>🚴 '+esc(riderNames[row.courier_id]||row.courier_id)+'</span><span class="tag">'+row.effective_from+' → '+(row.effective_to||'∞')+'</span></div>').concat(supervisors.map(row=>'<div class="row"><span>🧑‍💼 '+esc(supervisorNames[row.supervisor_id]||row.supervisor_id)+'</span><span class="tag">'+row.effective_from+' → '+(row.effective_to||'∞')+'</span></div>'));history.innerHTML=rows.join('')||'<div class="empty">'+text('لا توجد تعيينات','No assignments')+'</div>'}catch(error){setStatus(error.message,true)}}
const today=new Date().toISOString().slice(0,10);transferDate.value=today;supervisorDate.value=today;load();
</script></body></html>
