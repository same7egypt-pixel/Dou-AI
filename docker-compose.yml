# DOU Fleet OS — production stack.
# Every secret is required from the environment (a .env file next to this
# compose file, mode 600). There are deliberately no inline defaults: a
# guessable fallback password is worse than a container that refuses to start.
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    # No source bind mount: the container runs the code baked into its image,
    # so a release is always a rebuild and never a file copy onto a running
    # container. Deploy with `docker compose up -d --build`.
    # This one mount is data, not code — database dumps have to outlive the
    # container they were written in.
    volumes:
      - .:/app
      - ./backups:/app/backups
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env (openssl rand -hex 16)}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METABASE_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET_KEY:-dou_metabase_secret_embedded_2026_key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Staging, for running the E2E suite without touching customer data.
  #
  # Started on demand, not with the stack:
  #   docker compose --profile staging up -d --build
  #   docker compose --profile staging down
  #
  # It reuses the running PostgreSQL and Redis rather than starting its own,
  # because this host has under 1 GB of RAM. Isolation comes from a separate
  # database (STAGING_POSTGRES_DB) and a separate Redis index, not separate
  # servers - so a failure of the shared host takes both down. That is the
  # accepted trade for a free environment; revisit it before real customer load.
  staging:
    profiles: ["staging"]
    build: .
    restart: "no"
    volumes:
      - ./backups:/app/backups
    environment:
      # Deliberately production, so staging exercises the same code paths and
      # the same config validation the live stack does.
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${STAGING_POSTGRES_DB:-dou_staging}
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${STAGING_SECRET_KEY:?set STAGING_SECRET_KEY in .env (openssl rand -hex 32)}
      ADMIN_KEY: ${STAGING_ADMIN_KEY:?set STAGING_ADMIN_KEY in .env (openssl rand -hex 16)}
      STORAGE_PROVIDER: LOCAL
      SEED_DEMO_DATA: ${STAGING_SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # One worker, not four: this box is already swapping under the live stack.
    command: >-
      sh -c "python tools/migrate.py || exit 1;
      if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then python seed.py || exit 1; fi;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  postgres_data:
  redis_data:
