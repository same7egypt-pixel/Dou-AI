# DOU Fleet OS — production stack.
# Every secret is required from the environment (a .env file next to this
# compose file, mode 600). There are deliberately no inline defaults: a
# guessable fallback password is worse than a container that refuses to start.
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dou_fleet_db}
      POSTGRES_USER: ${POSTGRES_USER:-dou_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dou_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    volumes:
      - .:/app
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dou_user}:${POSTGRES_PASSWORD:-dou_secure_pass_2026}@db:5432/${POSTGRES_DB:-dou_fleet_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dou_fleet_jwt_secret_key_prod_2026_super_secure}
      ADMIN_KEY: ${ADMIN_KEY:-dou_admin_key_2026}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  redis_data:
